# Pinned inputs for the build. Shell-sourceable (KEY=value, no spaces).

# Upstream Dropbear release this repo is pinned to. CI also builds a NEWER
# upstream release automatically when one appears (GPG-verified, see
# tools/fetch-source.sh); the sha256 below only applies to this version.
DROPBEAR_VERSION=2026.94
DROPBEAR_SHA256=e098034a843699200c8c977a991fff73159735bf795d5f72ef672c41a6b1ae81
DROPBEAR_URL=https://matt.ucc.asn.au/dropbear/releases
# "Dropbear SSH Release Signing <matt@ucc.asn.au>" (keys/dropbear-release-signing.asc).
# Same fingerprint served by the release site and by keyserver.ubuntu.com.
DROPBEAR_SIGNING_FPR=F7347EF2EE2E07A267628CA944931494F29C6773

# Package revision: bump when patches, options or packaging change for the
# same upstream version (opkg only upgrades on a higher version). A newer
# upstream version always starts at 1.
PKG_RELEASE=1

# OpenWrt commit the vendored patches (patches/openwrt) and the build options
# (config/localoptions.h) were taken from: package/network/services/dropbear.
OPENWRT_COMMIT=c82de84430c3a0298bb782d180a80f2bf27f43bc

# Cross compiler: zig cc, with its bundled musl, builds static binaries for
# every architecture from one download.
ZIG_VERSION=0.17.1
ZIG_SHA256=3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a
